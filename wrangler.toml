name = "ethio-casino-bot"
main = "worker.js"
compatibility_date = "2026-09-21"
compatibility_flags = ["nodejs_compat"]

[vars]
NODE_ENV = "production"

# Set these in Cloudflare dashboard (Settings > Variables):
# BOT_TOKEN = "8892760229:AAE1t7UaYnqpm073O8X7Z-Y3AwO-fFI8w2E"
# WEBAPP_URL = "https://your-frontend.pages.dev"
# NVIDIA_API_KEY = "your_nvidia_key"
# NVIDIA_BASE_URL = "https://integrate.api.nvidia.com/v1"
# OWNER_TELEGRAM_IDS = "361695664"

# For SQLite/D1 database (optional - use Cloudflare D1)
# [[d1_databases]]
# binding = "DB"
# database_name = "ethio-casino-db"
# database_id = "your-d1-database-id"

# For KV storage (sessions, caching)
# [[kv_namespaces]]
# binding = "CACHE"
# id = "your-kv-namespace-id"

# For scheduled tasks (cron triggers)
[triggers]
crons = ["0 * * * *"]  # Daily bonus reminders hourly

# Observability
[observability]
enabled = true
head_sampling_rate = 1.0